</svg><rect x="1120" y="225" width="160" height="165" fill="none" stroke="#214F40" stroke-dasharray="6 5" stroke-width="1.5"/><text x="1310" y="300" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#214F40">X</text><text x="1028" y="434" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#343B36">X = one symbol stem width.</text><text x="1028" y="465" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#343B36">Keep X clear around visible ink, not SVG edges.</text><rect x="48" y="394" width="920" height="232" rx="18" fill="#FFFFFF"/><text x="76" y="430" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#214F40">Colour / use one colour at a time</text><rect x="76" y="458" width="80" height="80" rx="10" fill="#214F40"/><text x="178" y="480" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#214F40">Forest · #214F40</text><text x="178" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">RGB 33 / 79 / 64</text><text x="178" y="540" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#343B36">CMYK ≈ 58 / 0 / 19 / 69*</text><rect x="530" y="458" width="80" height="80" rx="10" fill="#F5F6F3"/><text x="632" y="480" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#214F40">Mist · #F5F6F3</text><text x="632" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">RGB 245 / 246 / 243</text><text x="632" y="540" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#343B36">CMYK ≈ 0 / 0 / 1 / 4*</text><text x="76" y="583" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#343B36">Forest on white / Mist; corrected white on Forest / dark. Black on white.</text><text x="76" y="608" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#343B36">*Unprofiled estimates; print and spot / Pantone matching require a physical proof.</text><rect x="1000" y="534" width="552" height="264" rx="18" fill="#FFFFFF"/><text x="1028" y="572" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#214F40">Minimum screen sizes</text><text x="1028" y="611" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">Small identifier</text><text x="1260" y="611" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#214F40">16 px; small cut at 16–24</text><text x="1028" y="648" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">Regular identifier</text><text x="1260" y="648" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#214F40">32 px</text><text x="1028" y="685" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">Horizontal</text><text x="1260" y="685" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#214F40">160 px wide</text><text x="1028" y="722" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#343B36">Wordmark / stacked</text><text x="1260" y="722" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#214F40">128 px wide</text><text x="1028" y="769" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#343B36">Print: starting sizes in USAGE.md; proof first.</text><rect x="48" y="654" width="920" height="144" rx="18" fill="#FFFFFF"/><text x="76" y="691" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#214F40">Type and lockups</text><text x="76" y="725" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#343B36">Figtree-based outlined name: 580 normal / 560 reversed, custom a and k.</text><text x="76" y="756" font-family="Arial,Helve