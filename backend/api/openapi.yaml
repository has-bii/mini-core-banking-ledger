openapi: 3.0.3
info:
  title: Mini Core Banking Ledger API
  version: 0.1.0
  description: |
    Contract for the implemented authentication and wallet APIs.
    JSON request bodies must contain exactly one UTF-8 JSON object and must not
    exceed 1 MiB. Field names are case-sensitive; unknown fields and duplicate
    object member names are rejected. JSON strings must not contain unpaired
    UTF-16 surrogate escapes. Empty, malformed, non-object, and otherwise invalid
    bodies return 400. Oversized bodies return 413, including oversized trailing
    whitespace.

    Auth, wallet, and shared middleware use problem details
    (application/problem+json): type, title, status, detail, instance, and
    optional validation errors keyed by JSON field name. Success responses use
    data and an optional message; logout returns an empty 204.

    Invalid field values return 400 with the detail
    "One or more fields are invalid. Check the field errors for details."
    All invalid fields are reported, with only the first failed rule per field.
    Decoding stops at the first error and omits validation errors.
    Clients should use HTTP statuses and field keys, not parse messages.

    Sessions last 30 minutes by default. The server's SESSION_LIFETIME setting
    applies to new sessions only. Redis expires sessions automatically. Session
    tokens are stored as SHA-256 hashes and never returned in JSON.
    Login-specific brute-force protection is not implemented.

    A shared in-memory token bucket limits requests across all clients per API
    process. RATE_LIMIT_CAPACITY defaults to 50 tokens (burst size) and
    RATE_LIMIT_REFILL_RATE defaults to 10 tokens per second. Exhaustion returns
    429 problem details. CORS preflight requests bypass the
    bucket. Limits reset on restart and are not shared between instances.

    CORS allows exact frontend origins configured as a comma-separated list in
    CORS_ORIGIN, for example https://app.example.com,https://admin.example.com.
    Whitespace is trimmed and blank entries are ignored. An unset or empty value
    defaults to http://localhost:3000; a nonempty list with no origins is rejected.
    This is separate from the API server URL below.
    Responses to allowed origins include Access-Control-Allow-Origin matching the
    origin and Access-Control-Allow-Credentials: true. Browser clients must
    use credentials: 'include' to send and receive session cookies.
    Session cookies remain SameSite=Lax; CORS alone does not enable cookies
    between unrelated sites.

    All OPTIONS requests receive 204. CORS sets Access-Control-Allow-Methods:
    GET, HEAD, POST, PUT, DELETE and Access-Control-Allow-Headers: Content-Type.
    All responses include Vary: Origin. Only the configured origin receives
    Access-Control-Allow-Origin and credential permission. Existing CSRF
    protection remains active: unsafe browser requests from untrusted origins
    return 403, while same-origin and trusted-origin requests are allowed.
servers:
  - url: http://localhost:8080/api
    description: Local development (default HTTP_ADDR)
tags:
  - name: Auth
  - name: Wallets
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user
      description: Creates a user and password account. Does not create a session or set a cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Alice
              email: alice@example.com
              password: password123
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '409':
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: email already taken
                instance: /auth/register
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and create a session
      description: |
        Returns the user and sets the session cookie. Unknown users and wrong
        passwords both return 401 problem details. Handler responses include
        Cache-Control: no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: password123
      responses:
        '200':
          description: Authenticated; session cookie set for the configured lifetime (30 minutes by default).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: |
                session=<token>; Path=/; Max-Age=<lifetime in seconds>; Expires=<session expiry>;
                HttpOnly; SameSite=Lax. The default Max-Age is 1800 seconds.
                Secure is also set when APP_ENV is staging or prod; those
                environments require HTTPS.
              schema:
                type: string
              example: session=opaque-token; Path=/; Expires=Wed, 21 Oct 2026 07:28:00 GMT; Max-Age=1800; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          description: Invalid email or password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: invalid email or password
                instance: /auth/login
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Requires a valid, unexpired session. Missing, empty, expired, revoked,
        or otherwise invalid session cookies return 401 problem details.
        Handler and authentication-guard responses include Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Session is expired or invalid, or the user no longer exists.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Session is expired or invalid
                instance: /auth/me
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and clear its cookie
      description: |
        Idempotent: returns 204 even if the session is absent or invalid.
        Other sessions remain valid. Handler responses include Cache-Control:
        no-store. A session revocation failure returns 500 without clearing
        the cookie.
      security:
        - {}
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked if present; cookie cleared. No response body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: |
                Clears the session cookie with Path=/, Max-Age=0, an expiry
                in the past, HttpOnly and SameSite=Lax. Secure is also set
                when APP_ENV is staging or prod.
              schema:
                type: string
              example: session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; HttpOnly; SameSite=Lax
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /wallets:
    post:
      tags: [Wallets]
      operationId: createWallet
      summary: Create an wallet for the current user
      description: |
        Requires a valid, unexpired session. Creates a sub_wallet or savings
        wallet owned by the current user, with a zero balance and the next
        sort_order. Main wallets cannot be created through this endpoint.
        Ownership, balance, and sort_order are assigned by the server and must
        not be supplied in the request. Responses from the wallet handler
        and authentication guard include Cache-Control: no-store; errors from
        shared middleware may omit this header.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
            example:
              name: Travel
              wallet_type: savings
      responses:
        '201':
          description: Wallet created for the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/WalletBadRequest'
        '413':
          $ref: '#/components/responses/WalletPayloadTooLarge'
        '401':
          $ref: '#/components/responses/WalletUnauthenticated'
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/WalletInternalError'
    get:
      tags: [Wallets]
      operationId: getWallets
      summary: List the current user's wallets
      description: |
        Requires a valid, unexpired session. Returns only wallets belonging to
        the current user, ordered by sort_order ascending. Query parameters
        are ignored. Responses from the wallet
        handler and authentication guard include Cache-Control: no-store;
        errors from the shared middleware may omit this header.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Wallets for the current user; an empty array if none exist.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsResponse'
        '400':
          $ref: '#/components/responses/WalletBadRequest'
        '401':
          $ref: '#/components/responses/WalletUnauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/WalletInternalError'
  /wallets/{id}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Get one of the current user's wallets
      description: |
        Requires a valid, unexpired session. Returns 404 for both missing
        wallets and wallets belonging to another user. Query parameters
        are ignored. Responses from the wallet handler and authentication
        guard include Cache-Control: no-store; errors from shared middleware
        may omit this header.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of an wallet belonging to the current user.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested wallet belonging to the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/WalletBadRequest'
        '401':
          $ref: '#/components/responses/WalletUnauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/WalletInternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque session token set by login; expires after the configured lifetime (30 minutes by default).
  headers:
    NoStore:
      description: Prevents caching of session-related and wallet responses.
      schema:
        type: string
        enum: [no-store]
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation and lookup.
            Must satisfy go-playground/validator/v10's built-in email rule.
            Display names, unqualified domains, and IP-literal domains are
            rejected; quoted local parts are permitted. Case is preserved.
          example: alice@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: |
            At least 8 Unicode characters, at most 72 UTF-8 bytes, and not
            entirely whitespace. The password is not trimmed. The byte limit
            cannot be represented by OpenAPI maxLength.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed; the result must not be empty.
          example: Alice
        email:
          $ref: '#/components/schemas/LoginRequest/properties/email'
        password:
          $ref: '#/components/schemas/LoginRequest/properties/password'
    User:
      type: object
      required: [id, name, email, image, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Alice
        email:
          type: string
          example: alice@example.com
        image:
          type: string
          nullable: true
          description: Profile image value; null when unset.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    CreateWalletRequest:
      type: object
      additionalProperties: false
      required: [name, wallet_type]
      properties:
        name:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation. The result
            must contain 3 to 32 ASCII letters or spaces and must not be empty.
          example: Travel
        wallet_type:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation. The result
            must be sub_wallet or savings (case-sensitive); main is rejected.
          example: savings
    Wallet:
      type: object
      required: [id, user_id, name, wallet_type, sort_order, balance, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        wallet_type:
          type: string
          enum: [main, sub_wallet, savings]
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        balance:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    WalletResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Wallet'
        message:
          type: string
          description: Optional success message; omitted when empty.
    WalletsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
        message:
          type: string
          description: Optional success message; omitted when empty.
    WalletProblem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: ['about:blank']
        title:
          type: string
          description: HTTP status text.
        status:
          type: integer
        detail:
          type: string
          description: Client-safe explanation; not a stable machine-readable code.
        instance:
          type: string
          description: Request path without query parameters. Handler responses omit the /api prefix; outer middleware responses retain it.
        errors:
          type: object
          description: Optional validation messages keyed by JSON field name; first failed rule per field.
          additionalProperties:
            type: array
            items:
              type: string
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/WalletProblem'
  responses:
    WalletBadRequest:
      description: Invalid JSON object, unknown field, invalid field value, or invalid wallet/user ID. Only validation failures include errors.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WalletProblem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: One or more fields are invalid. Check the field errors for details.
            instance: /wallets
            errors:
              name: [This field is required]
    WalletUnauthenticated:
      description: Session is expired or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WalletProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Session is expired or invalid
            instance: /wallets
    WalletNotFound:
      description: Wallet or owner was not found, or the wallet belongs to another user.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WalletProblem'
    WalletPayloadTooLarge:
      description: Request body exceeds 1 MiB, including trailing data.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WalletProblem'
    WalletInternalError:
      description: Unexpected server error. Wallet handler errors include no-store; shared middleware may omit it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WalletProblem'
    PayloadTooLarge:
      description: |
        Request body exceeds 1 MiB. Login and wallet handler responses
        include Cache-Control: no-store.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: body must not be larger than 1048576 bytes
            instance: /auth/register
    TooManyRequests:
      description: Shared per-process token bucket exhausted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded
            instance: /api/auth/login
    CrossOriginForbidden:
      description: |
        Rejected by CSRF protection before the authentication handler runs.
        Uses the same problem-details format as other API errors.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Cross-origin request denied.
            instance: /api/auth/login
    BadRequest:
      description: |
        Malformed or non-object JSON, unknown fields, type mismatches,
        multiple JSON values, empty bodies, or invalid field values.
        Only validation failures include errors keyed by JSON field name.
        Login responses include Cache-Control: no-store.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJSON:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: body must not be empty
                instance: /auth/register
            validationError:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more fields are invalid. Check the field errors for details.
                instance: /auth/register
                errors:
                  password: [Must contain at least 8 characters]
    InternalError:
      description: |
        Unexpected server error. Responses from the login, current-user,
        logout and wallet handlers include Cache-Control: no-store.
        Shared middleware may omit this header and uses the generic detail
        "Unexpected error has occurred" instead of "internal error".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: internal error
            instance: /auth/login
