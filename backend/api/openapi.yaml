openapi: 3.0.3
info:
  title: Mini Core Banking Ledger API
  version: 0.1.0
  description: |
    Contract for the implemented authentication and account APIs.
    JSON request bodies must contain exactly one JSON object, must not exceed
    1 MiB, and must not contain unknown fields. Empty, malformed, non-object,
    and otherwise invalid bodies return 400. Oversized bodies return 413,
    including oversized trailing whitespace.

    Auth, account, and shared middleware use v2 problem details
    (application/problem+json): type, title, status, detail, instance, and
    optional validation errors keyed by JSON field name. Success responses use
    data and an optional message; logout returns an empty 204.

    Invalid field values return 400 with the detail
    "One or more fields are invalid. Check the field errors for details."
    All invalid fields are reported, with only the first failed rule per field.
    Decoding stops at the first error and omits validation errors.
    Clients should use HTTP statuses and field keys, not parse messages.

    Sessions last 24 hours. Session tokens are stored as SHA-256 hashes and
    never returned in JSON. Login-specific brute-force protection and automatic
    expired-session cleanup are not implemented.

    A shared in-memory token bucket limits requests across all clients per API
    process. RATE_LIMIT_CAPACITY defaults to 50 tokens (burst size) and
    RATE_LIMIT_REFILL_RATE defaults to 10 tokens per second. Exhaustion returns
    429 problem details. CORS preflight requests bypass the
    bucket. Limits reset on restart and are not shared between instances.

    CORS allows one exact frontend origin configured by CORS_ORIGIN, defaulting
    to http://localhost:3000. This is separate from the API server URL below.
    Responses to that origin include Access-Control-Allow-Origin matching the
    origin and Access-Control-Allow-Credentials: true. Browser clients must
    use credentials: 'include' to send and receive session cookies.
    Session cookies remain SameSite=Lax; CORS alone does not enable cookies
    between unrelated sites.

    All OPTIONS requests receive 204. CORS sets Access-Control-Allow-Methods:
    GET, HEAD, POST, PUT, DELETE and Access-Control-Allow-Headers: Content-Type.
    All responses include Vary: Origin. Only the configured origin receives
    Access-Control-Allow-Origin and credential permission. Existing CSRF
    protection remains active: unsafe browser requests from untrusted origins
    return 403, while same-origin and trusted-origin requests are allowed.
servers:
  - url: http://localhost:8080/api
    description: Local development (default HTTP_ADDR)
tags:
  - name: Auth
  - name: Accounts
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user
      description: Creates a user and password account. Does not create a session or set a cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Alice
              email: alice@example.com
              password: password123
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '409':
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: email already taken
                instance: /auth/register
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and create a session
      description: |
        Returns the user and sets the session cookie. Unknown users and wrong
        passwords both return 401 problem details. Handler responses include
        Cache-Control: no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: password123
      responses:
        '200':
          description: Authenticated; session cookie set for 24 hours.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: |
                session=<token>; Path=/; Max-Age=86400; Expires=<expiry>;
                HttpOnly; SameSite=Lax. Secure is also set when APP_ENV is
                staging or prod; those environments require HTTPS.
              schema:
                type: string
              example: session=opaque-token; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          description: Invalid email or password.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: invalid email or password
                instance: /auth/login
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Requires a valid, unexpired session. Missing, empty, expired, revoked,
        or otherwise invalid session cookies return 401 problem details.
        Handler and authentication-guard responses include Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Session is expired or invalid, or the user no longer exists.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Session is expired or invalid
                instance: /auth/me
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and clear its cookie
      description: |
        Idempotent: returns 204 even if the session is absent or invalid.
        Other sessions remain valid. Handler responses include Cache-Control:
        no-store. A session revocation failure returns 500 without clearing
        the cookie.
      security:
        - {}
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked if present; cookie cleared. No response body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: |
                Clears the session cookie with Path=/, Max-Age=0, an expiry
                in the past, HttpOnly and SameSite=Lax. Secure is also set
                when APP_ENV is staging or prod.
              schema:
                type: string
              example: session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; HttpOnly; SameSite=Lax
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account for the current user
      description: |
        Requires a valid, unexpired session. Creates a sub_account or savings
        account owned by the current user, with a zero balance and the next
        sort_order. Main accounts cannot be created through this endpoint.
        Ownership, balance, and sort_order are assigned by the server and must
        not be supplied in the request. Responses from the account handler
        and authentication guard include Cache-Control: no-store; errors from
        shared middleware may omit this header.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Travel
              account_type: savings
      responses:
        '201':
          description: Account created for the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/AccountBadRequest'
        '413':
          $ref: '#/components/responses/AccountPayloadTooLarge'
        '401':
          $ref: '#/components/responses/AccountUnauthenticated'
        '403':
          $ref: '#/components/responses/CrossOriginForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/AccountInternalError'
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: List the current user's accounts
      description: |
        Requires a valid, unexpired session. Returns only accounts belonging to
        the current user, ordered by sort_order ascending. Query parameters
        are ignored. Responses from the account
        handler and authentication guard include Cache-Control: no-store;
        errors from the shared middleware may omit this header.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Accounts for the current user; an empty array if none exist.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '400':
          $ref: '#/components/responses/AccountBadRequest'
        '401':
          $ref: '#/components/responses/AccountUnauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/AccountInternalError'
  /accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one of the current user's accounts
      description: |
        Requires a valid, unexpired session. Returns 404 for both missing
        accounts and accounts belonging to another user. Query parameters
        are ignored. Responses from the account handler and authentication
        guard include Cache-Control: no-store; errors from shared middleware
        may omit this header.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of an account belonging to the current user.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested account belonging to the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/AccountBadRequest'
        '401':
          $ref: '#/components/responses/AccountUnauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/AccountInternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque session token set by login; expires after 24 hours.
  headers:
    NoStore:
      description: Prevents caching of session-related and account responses.
      schema:
        type: string
        enum: [no-store]
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation and lookup.
            Must satisfy go-playground/validator/v10's built-in email rule.
            Display names, unqualified domains, and IP-literal domains are
            rejected; quoted local parts are permitted. Case is preserved.
          example: alice@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: |
            At least 8 Unicode characters, at most 72 UTF-8 bytes, and not
            entirely whitespace. The password is not trimmed. The byte limit
            cannot be represented by OpenAPI maxLength.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed; the result must not be empty.
          example: Alice
        email:
          $ref: '#/components/schemas/LoginRequest/properties/email'
        password:
          $ref: '#/components/schemas/LoginRequest/properties/password'
    User:
      type: object
      required: [id, name, email, image, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Alice
        email:
          type: string
          example: alice@example.com
        image:
          type: string
          nullable: true
          description: Profile image value; null when unset.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, account_type]
      properties:
        name:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation. The result
            must contain 3 to 32 ASCII letters or spaces and must not be empty.
          example: Travel
        account_type:
          type: string
          description: |
            Surrounding whitespace is trimmed before validation. The result
            must be sub_account or savings (case-sensitive); main is rejected.
          example: savings
    Account:
      type: object
      required: [id, user_id, name, account_type, sort_order, balance, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        account_type:
          type: string
          enum: [main, sub_account, savings]
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        balance:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    AccountResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Account'
        message:
          type: string
          description: Optional success message; omitted when empty.
    AccountsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        message:
          type: string
          description: Optional success message; omitted when empty.
    AccountProblem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum: ['about:blank']
        title:
          type: string
          description: HTTP status text.
        status:
          type: integer
        detail:
          type: string
          description: Client-safe explanation; not a stable machine-readable code.
        instance:
          type: string
          description: Request path without query parameters. Handler responses omit the /api prefix; outer middleware responses retain it.
        errors:
          type: object
          description: Optional validation messages keyed by JSON field name; first failed rule per field.
          additionalProperties:
            type: array
            items:
              type: string
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AccountProblem'
  responses:
    AccountBadRequest:
      description: Invalid JSON object, unknown field, invalid field value, or invalid account/user ID. Only validation failures include errors.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: One or more fields are invalid. Check the field errors for details.
            instance: /accounts
            errors:
              name: [This field is required]
    AccountUnauthenticated:
      description: Session is expired or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Session is expired or invalid
            instance: /accounts
    AccountNotFound:
      description: Account or owner was not found, or the account belongs to another user.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountPayloadTooLarge:
      description: Request body exceeds 1 MiB, including trailing data.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountInternalError:
      description: Unexpected server error. Account handler errors include no-store; shared middleware may omit it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    PayloadTooLarge:
      description: |
        Request body exceeds 1 MiB. Login and account handler responses
        include Cache-Control: no-store.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: body must not be larger than 1048576 bytes
            instance: /auth/register
    TooManyRequests:
      description: Shared per-process token bucket exhausted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded
            instance: /api/auth/login
    CrossOriginForbidden:
      description: |
        Rejected by CSRF protection before the authentication handler runs.
        This response is plain text, not the API JSON error envelope.
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: |
        Malformed or non-object JSON, unknown fields, type mismatches,
        multiple JSON values, empty bodies, or invalid field values.
        Only validation failures include errors keyed by JSON field name.
        Login responses include Cache-Control: no-store.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJSON:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: body must not be empty
                instance: /auth/register
            validationError:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: One or more fields are invalid. Check the field errors for details.
                instance: /auth/register
                errors:
                  password: [Must contain at least 8 characters]
    InternalError:
      description: |
        Unexpected server error. Responses from the login, current-user,
        logout and account handlers include Cache-Control: no-store.
        Shared middleware may omit this header and uses the generic detail
        "Unexpected error has occurred" instead of "internal error".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: internal error
            instance: /auth/login
